<style>
/* ============================================================
   DESIGN TOKENS (colours are overridden from BR_CONFIG.colors)
   ============================================================ */
:root {
  --c-ivory: #F7F1EC;
  --c-dusty: #EAD6D4;
  --c-deep:  #693D48;
  --c-mauve: #98616B;
  --c-white: #FFFFFF;
  --c-text:  #3B2429;
  --c-muted: #8B7176;
  --line:    rgba(105, 61, 72, .10);
  --line-strong: rgba(105, 61, 72, .22);

  --radius: 20px;
  --shadow-sm: 0 1px 2px rgba(105,61,72,.05), 0 6px 18px rgba(105,61,72,.06);
  --shadow-md: 0 2px 4px rgba(105,61,72,.07), 0 14px 30px rgba(105,61,72,.13);

  --font-ar: 'Cairo', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
  --font-en: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;

  --cta-h: 58px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-ar);
  color: var(--c-text);
  background:
    radial-gradient(140% 55% at 50% -12%, var(--c-dusty) 0%, rgba(234,214,212,0) 62%),
    var(--c-ivory);
  background-color: var(--c-ivory);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  position: relative;
  isolation: isolate;
  /* room so the floating CTA never covers the last card */
  padding-bottom: calc(var(--cta-h) + 44px + env(safe-area-inset-bottom));
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  background-image: url('./salon-model-bg.png');
  background-position: 68% top;
  background-repeat: no-repeat;
  background-size: cover;
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(180deg, rgba(247,241,236,.45) 0%, rgba(247,241,236,.68) 42%, rgba(247,241,236,.88) 100%),
    radial-gradient(100% 48% at 4% 2%, rgba(255,255,255,.22), transparent 66%);
  pointer-events: none;
}
a { color: inherit; }
img, svg { display: block; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.page {
  position: relative;
  z-index: 1;
  max-width: 480px;
  margin: 0 auto;
  padding: 30px 18px 0;
}

/* ============================================================
   1. BRAND HEADER
   ============================================================ */
.brand { text-align: center; padding-bottom: 24px; }

.brand__logo {
  position: relative;
  width: 110px; height: 110px;
  margin: 0 auto 14px;
  padding: 3px;
  overflow: hidden;
  border: 1px solid var(--line-strong);
  border-radius: 25px;
  background: rgba(255,255,255,.78);
  box-shadow: 0 8px 24px rgba(105,61,72,.11);
  display: grid; place-items: center;
  color: var(--c-deep);
}
.brand__logo::after {           /* thin outer ring */
  content: none;
}
.brand__logo img {
  position: absolute;
  inset: 3px;
  width: calc(100% - 6px);
  height: calc(100% - 6px);
  object-fit: contain;
  border-radius: 21px;
}
.brand__logo svg { width: 70px; height: 70px; }

.brand__name {
  font-family: var(--font-en);
  font-weight: 300;
  font-size: 25px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--c-deep);
  line-height: 1.3;
}
.brand__name .amp { color: var(--c-mauve); font-weight: 400; }
.brand__name--visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.ornament {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin: 10px auto 8px;
}
.ornament span { width: 30px; height: 1px; background: var(--line-strong); }
.ornament i {
  width: 5px; height: 5px; transform: rotate(45deg);
  background: var(--c-mauve); opacity: .7;
}

.brand__tagline {
  font-weight: 700;
  font-size: 21px;
  color: var(--c-deep);
  line-height: 1.5;
}
.brand__sub {
  font-size: 15px;
  color: var(--c-muted);
  margin-top: 2px;
}

/* ============================================================
   SECTION LABELS
   ============================================================ */
.section-label {
  display: flex; align-items: center; gap: 12px;
  font-size: 13px; font-weight: 600;
  color: var(--c-mauve);
  margin: 0 2px 12px;
  white-space: nowrap;
}
.section-label::before,
.section-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* ============================================================
   2 & 3. CARDS (services + salon info)
   ============================================================ */
.cards { list-style: none; display: grid; gap: 12px; }

.card {
  display: flex; align-items: center; gap: 14px;
  min-height: 78px;
  padding: 14px 16px;
  background: rgba(255, 255, 255, .90);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
  transition: transform .28s var(--ease), box-shadow .28s var(--ease), border-color .28s var(--ease);
}
.card:focus-visible { outline: 2px solid var(--c-deep); outline-offset: 3px; }
.card:active { transform: scale(.985); }

.card__icon {
  flex: 0 0 50px; height: 50px;
  border-radius: 15px;
  background: var(--c-dusty);
  color: var(--c-deep);
  display: grid; place-items: center;
}
.card__icon svg { width: 25px; height: 25px; }

.card__text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.card__title {
  font-weight: 700;
  font-size: 16.5px;
  line-height: 1.45;
  color: var(--c-text);
}
.card__subtitle {
  font-family: var(--font-en);
  font-size: 12px;
  letter-spacing: .03em;
  color: var(--c-mauve);
  line-height: 1.5;
}

.card__arrow {
  flex: 0 0 34px; height: 34px;
  border-radius: 50%;
  background: var(--c-ivory);
  color: var(--c-mauve);
  display: grid; place-items: center;
  transition: transform .28s var(--ease), background-color .28s var(--ease), color .28s var(--ease);
}
.card__arrow svg { width: 17px; height: 17px; }

@media (hover: hover) {
  .card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: var(--line-strong);
  }
  .card:hover .card__arrow {
    background: var(--c-deep);
    color: var(--c-white);
    transform: translateX(-3px);
  }
}

/* Salon info cards – slightly quieter so services stay the hero */
.info { margin-top: 26px; }
.card--info {
  background: rgba(255, 255, 255, .76);
  box-shadow: none;
  min-height: 72px;
}
.card--info .card__icon { background: var(--c-white); box-shadow: inset 0 0 0 1px var(--line); }
.card--info .card__subtitle { font-family: var(--font-ar); font-size: 13px; letter-spacing: 0; color: var(--c-muted); }

/* ============================================================
   FOOTER
   ============================================================ */
.footer {
  text-align: center;
  margin-top: 30px;
  font-size: 12px;
  color: var(--c-muted);
}
.footer bdi { font-family: var(--font-en); }

/* ============================================================
   4. FLOATING WHATSAPP CTA
   ============================================================ */
.cta-float {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 50;
  display: flex; justify-content: center;
  padding: 18px 16px calc(14px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--c-ivory) 58%, rgba(247, 241, 236, 0));
  pointer-events: none;
}
.cta-float__btn {
  pointer-events: auto;
  width: 100%; max-width: 448px;
  height: var(--cta-h);
  border-radius: 999px;
  background: var(--c-deep);
  color: var(--c-white);
  display: flex; align-items: center; justify-content: center; gap: 10px;
  text-decoration: none;
  font-weight: 700;
  font-size: 17px;
  box-shadow: 0 10px 26px rgba(105, 61, 72, .32);
  -webkit-tap-highlight-color: transparent;
  transition: transform .25s var(--ease), box-shadow .25s var(--ease), filter .25s var(--ease);
}
.cta-float__btn svg { width: 22px; height: 22px; flex: none; }
.cta-float__btn small {
  font-weight: 400; font-size: 13px; opacity: .8;
  padding-inline-start: 10px;
  border-inline-start: 1px solid rgba(255, 255, 255, .3);
}
.cta-float__btn:focus-visible { outline: 2px solid var(--c-deep); outline-offset: 4px; }
.cta-float__btn:active { transform: scale(.98); }
@media (hover: hover) {
  .cta-float__btn:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: 0 14px 32px rgba(105, 61, 72, .38); }
}

/* Setup notice (only appears if a link hasn't been configured yet) */
.toast {
  position: fixed;
  left: 50%; bottom: calc(var(--cta-h) + 40px + env(safe-area-inset-bottom));
  transform: translate(-50%, 10px);
  max-width: calc(100% - 32px);
  padding: 10px 16px;
  border-radius: 12px;
  background: var(--c-text);
  color: #fff;
  font-size: 13.5px;
  text-align: center;
  opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s;
  z-index: 60;
}
.toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 359px) {
  .page { padding-inline: 14px; }
  .brand__name { font-size: 22px; }
  .card { gap: 12px; padding: 12px 13px; }
  .card__title { font-size: 15.5px; }
  .cta-float__btn small { display: none; }
}
@media (min-width: 768px) {
  .page { padding-top: 56px; }
  .brand__logo { width: 124px; height: 124px; }
  .brand__logo svg { width: 78px; height: 78px; }
  .brand__name { font-size: 28px; }
  .brand__tagline { font-size: 23px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>

<body>
<main class="page">

  <!-- ===================== 1. BRAND HEADER ===================== -->
  <header class="brand">
    <div class="brand__logo" id="brandLogo">
      <!-- Placeholder monogram — replaced automatically when BR_CONFIG.logoUrl is set -->
      <svg viewBox="0 0 70 70" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <g transform="translate(35 26) scale(1.35) translate(-35 -26)" stroke-width="1">
          <path d="M35 14c-3.4 1.6-5.2 4.3-5.2 7 0 2 2.3 3.4 5.2 3.4s5.2-1.4 5.2-3.4c0-2.7-1.8-5.4-5.2-7z"/>
          <path d="M27.5 21.5c0 6.6 3.4 10.8 7.5 10.8s7.5-4.2 7.5-10.8"/>
          <path d="M35 32.3v8.2"/>
          <path d="M35 37.2c1.9-2.6 4.4-3.2 6.1-2.6-.8 2.1-3.2 3.2-6.1 2.6z"/>
        </g>
        <text x="35" y="56" fill="currentColor" stroke="none" font-family="Poppins, sans-serif" font-size="11.5" font-weight="300" letter-spacing="2" text-anchor="middle">B&amp;R</text>
      </svg>
    </div>

    <h1 class="brand__name brand__name--visually-hidden" dir="ltr">Beauty <span class="amp">&amp;</span> Rose</h1>

    <div class="ornament" aria-hidden="true"><span></span><i></i><span></span></div>

    <p class="brand__tagline">جمالك يستحق الاهتمام</p>
    <p class="brand__sub">اختاري خدمتك واحجزي موعدك بكل سهولة</p>
  </header>

  <!-- ===================== 2. SERVICES ===================== -->
  <section aria-labelledby="servicesTitle">
    <h2 class="section-label" id="servicesTitle">اختاري الخدمة للحجز عبر واتساب</h2>
    <!-- Cards are generated from BR_CONFIG.services -->
    <ul class="cards" id="servicesList"></ul>
    <noscript>
      <p style="text-align:center;color:#8B7176;font-size:14px">يرجى تفعيل JavaScript لعرض الخدمات والحجز عبر واتساب.</p>
    </noscript>
  </section>

  <!-- ===================== 3. SALON INFO ===================== -->
  <section class="info" aria-labelledby="infoTitle">
    <h2 class="section-label" id="infoTitle">زوري الصالون وتابعي أعمالنا</h2>
    <ul class="cards">
      <li>
        <a class="card card--info" id="locationLink" href="#" target="_blank" rel="noopener" data-track="location">
          <span class="card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11.4a7 7 0 0 1 14 0C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.6" r="2.6"/></svg>
          </span>
          <span class="card__text">
            <span class="card__title">موقع الصالون</span>
            <span class="card__subtitle">شمال الرياض</span>
          </span>
          <span class="card__arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </span>
        </a>
      </li>
      <li>
        <a class="card card--info" id="instagramLink" href="#" target="_blank" rel="noopener" data-track="instagram">
          <span class="card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9A2.5 2.5 0 0 1 6 6.5h1.8L9.3 4.5h5.4l1.5 2H18A2.5 2.5 0 0 1 20.5 9v8.5A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5z"/><circle cx="12" cy="13" r="3.6"/></svg>
          </span>
          <span class="card__text">
            <span class="card__title">تابعي أعمالنا على إنستجرام</span>
            <span class="card__subtitle">اكتشفي أحدث إطلالاتنا</span>
          </span>
          <span class="card__arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </span>
        </a>
      </li>
    </ul>
  </section>

  <footer class="footer">
    <p>© <span id="year"></span> <bdi>Beauty &amp; Rose</bdi> – جميع الحقوق محفوظة</p>
  </footer>
</main>

<!-- ===================== 4. FLOATING WHATSAPP CTA ===================== -->
<div class="cta-float">
  <a class="cta-float__btn" id="ctaWhatsapp" href="#" target="_blank" rel="noopener"
     data-track="whatsapp" data-source="floating_cta"
     aria-label="احجزي موعدك الآن عبر واتساب">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 11.6a8.4 8.4 0 0 1-12.4 7.4L3.5 20.5l1.5-4.4a8.4 8.4 0 1 1 15.5-4.5z"/><path d="M8.7 11.7h.01M12 11.7h.01M15.3 11.7h.01" stroke-width="2.4"/></svg>
    <span>احجزي موعدك الآن</span>
    <small>واتساب</small>
  </a>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   PAGE LOGIC — no need to edit (all settings are in BR_CONFIG)
   ============================================================ */
(function () {
  'use strict';

  var C = window.BR_CONFIG;
  var T = C.tracking || {};
  var DEDUPE_MS = 1200;   // ignore accidental double-taps within this window

  /* ---------- Icons (line style, 24×24, inherit colour) ---------- */
  var ICONS = {
    hairColor: '<path d="M12 3.2c3.4 4 5.6 7.2 5.6 10.1a5.6 5.6 0 0 1-11.2 0c0-2.9 2.2-6.1 5.6-10.1z"/><path d="M9.3 14.2a2.8 2.8 0 0 0 2.7 2.6"/>',
    scissors:  '<circle cx="6" cy="6" r="2.8"/><circle cx="6" cy="18" r="2.8"/><path d="M20 4.5L8.1 15.9"/><path d="M14.5 14.5L20 19.5"/><path d="M8.1 8.1L12 11.8"/>',
    treatment: '<path d="M9.5 2.8h5"/><path d="M10.2 2.8v3.4L7.6 8.8a2 2 0 0 0-.6 1.4V19a2.2 2.2 0 0 0 2.2 2.2h5.6A2.2 2.2 0 0 0 17 19v-8.8a2 2 0 0 0-.6-1.4l-2.6-2.6V2.8"/><path d="M12 18.3c-2.3-1.1-2.9-3.8-.6-6.1 1.9 1.3 2.7 4 .6 6.1z"/>',
    makeup:    '<path d="M8 21.2h8"/><path d="M8.6 21.2V13h6.8v8.2"/><path d="M10 13V9.4h4V13"/><path d="M10 9.4V6.2l4-3v6.2"/>',
    nails:     '<path d="M10.2 2.8h3.6v4.4h-3.6z"/><path d="M7.2 11.2a2.4 2.4 0 0 1 2.4-2.4h4.8a2.4 2.4 0 0 1 2.4 2.4v7.6a2.4 2.4 0 0 1-2.4 2.4H9.6a2.4 2.4 0 0 1-2.4-2.4z"/><path d="M10.8 7.2v1.6M13.2 7.2v1.6"/><path d="M10 12.4v4"/>',
    facial:    '<circle cx="11" cy="13" r="7.6"/><path d="M8.2 11.6c.5.5 1.2.5 1.7 0M12.1 11.6c.5.5 1.2.5 1.7 0"/><path d="M8.6 15.6c1.4 1.2 3.4 1.2 4.8 0"/><path d="M19.6 2.4v3.6M17.8 4.2h3.6"/>',
    lashes:    '<path d="M3 9.6c2.5 3.4 5.5 5 9 5s6.5-1.6 9-5"/><path d="M12 14.6v3"/><path d="M7.6 13.5l-1.4 2.6"/><path d="M16.4 13.5l1.4 2.6"/><path d="M4.6 11.8l-1.8 1.9"/><path d="M19.4 11.8l1.8 1.9"/>'
  };
  var ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';

  function svg(paths) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---------- UTM / click-ID preservation ----------
     Captured on landing, kept for the session, and attached to every
     tracking event so GTM / pixels can attribute WhatsApp clicks. */
  var ATTR_KEYS = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term',
                   'fbclid', 'ttclid', 'gclid', 'ScCid'];
  var attribution = (function () {
    var out = {}, found = false;
    try {
      var p = new URLSearchParams(window.location.search);
      ATTR_KEYS.forEach(function (k) {
        var v = p.get(k);
        if (v) { out[k] = v.slice(0, 200); found = true; }
      });
    } catch (e) {}
    try {
      if (found) sessionStorage.setItem('br_attribution', JSON.stringify(out));
      else {
        var saved = sessionStorage.getItem('br_attribution');
        if (saved) out = JSON.parse(saved) || {};
      }
    } catch (e) {}
    return out;
  })();

  /* ---------- Reusable tracking function ----------
     Always pushes to window.dataLayer (for GTM).
     In direct mode (no GTM) it also forwards to the pixels loaded above.
     Never sends Lead / Purchase / booking-completed events. */
  function track(eventName, params) {
    params = params || {};
    // Reset keys so values from a previous event never leak into this one in GTM
    var payload = { event: eventName, service_name: undefined, service_category: undefined,
                    destination: undefined, source: undefined };
    Object.keys(params).forEach(function (k) { payload[k] = params[k]; });
    Object.keys(attribution).forEach(function (k) { payload[k] = attribution[k]; });

    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push(payload);

    var st = window.BR_TRACKING || {}, L = st.loaded || {};
    if (st.mode !== 'direct') return;
    try {
      if (L.ga4 && window.brGtag) {
        var ga = {};
        Object.keys(params).forEach(function (k) { ga[k] = params[k]; });
        Object.keys(attribution).forEach(function (k) { if (k.indexOf('utm_') === 0) ga[k] = attribution[k]; });
        window.brGtag('event', eventName, ga);
      }
      if (L.meta && window.fbq)   window.fbq('trackCustom', eventName, params);
      if (L.tiktok && window.ttq) window.ttq.track(eventName, params);
      if (L.snap && window.snaptr && T.snapEventMap && T.snapEventMap[eventName]) {
        window.snaptr('track', T.snapEventMap[eventName], { description: params.service_name || eventName });
      }
    } catch (e) { /* tracking must never block navigation */ }
  }
  window.BRTrack = track;   // available for custom use

  /* ---------- Link builders ---------- */
  var waNumber = String(C.whatsappNumber || '').replace(/\D/g, '').replace(/^0+/, '');

  function withCampaignRef(message) {
    if (!C.appendCampaignRefToMessage || !attribution.utm_source) return message;
    var ref = attribution.utm_source + (attribution.utm_campaign ? ' / ' + attribution.utm_campaign : '');
    return message + '\n(رمز الحملة: ' + ref + ')';
  }
  function waHref(message) {
    if (!waNumber) return '';
    return 'https://wa.me/' + waNumber + '?text=' + encodeURIComponent(withCampaignRef(message));
  }

  /* Wire a link, or mark it "not configured yet" (shows a setup notice instead of a dead link) */
  function setLink(el, href, missingMsg) {
    if (!el) return;
    if (href) {
      el.setAttribute('href', href);
      el.removeAttribute('data-unset');
    } else {
      el.setAttribute('href', '#');
      el.removeAttribute('target');
      el.setAttribute('data-unset', missingMsg);
    }
  }

  var MSG_NO_WA   = 'رقم واتساب لم يُضبط بعد (BR_CONFIG.whatsappNumber)';
  var MSG_NO_IG   = 'رابط إنستجرام لم يُضبط بعد (BR_CONFIG.instagramUrl)';
  var MSG_NO_MAPS = 'رابط الموقع لم يُضبط بعد (BR_CONFIG.googleMapsUrl)';

  /* ---------- Logo ---------- */
  if (C.logoUrl) {
    var logoBox = document.getElementById('brandLogo');
    logoBox.innerHTML = '<img src="' + esc(C.logoUrl) + '" alt="' + esc(C.brandName) + '" width="96" height="96" decoding="async">';
  }

  /* ---------- Render service cards ---------- */
  var list = document.getElementById('servicesList');
  list.innerHTML = (C.services || []).map(function (s) {
    var href = waHref(s.message);
    return '<li><a class="card" href="' + esc(href || '#') + '"' +
      (href ? ' target="_blank" rel="noopener"' : ' data-unset="' + esc(MSG_NO_WA) + '"') +
      ' data-track="service" data-service="' + esc(s.id) + '" data-category="' + esc(s.category) + '"' +
      ' aria-label="' + esc('احجزي عبر واتساب: ' + s.nameAr) + '">' +
        '<span class="card__icon" aria-hidden="true">' + svg(ICONS[s.icon] || ICONS.hairColor) + '</span>' +
        '<span class="card__text">' +
          '<span class="card__title">' + esc(s.nameAr) + '</span>' +
          (s.nameEn ? '<span class="card__subtitle" lang="en">' + esc(s.nameEn) + '</span>' : '') +
        '</span>' +
        '<span class="card__arrow" aria-hidden="true">' + ARROW + '</span>' +
      '</a></li>';
  }).join('');

  /* ---------- Wire static links ---------- */
  setLink(document.getElementById('ctaWhatsapp'),   waHref(C.generalWhatsappMessage), MSG_NO_WA);
  setLink(document.getElementById('instagramLink'), C.instagramUrl,  MSG_NO_IG);
  setLink(document.getElementById('locationLink'),  C.googleMapsUrl, MSG_NO_MAPS);

  if (!waNumber)          console.warn('[Beauty & Rose] Set BR_CONFIG.whatsappNumber to activate WhatsApp links.');
  if (!C.instagramUrl)    console.warn('[Beauty & Rose] Set BR_CONFIG.instagramUrl.');
  if (!C.googleMapsUrl)   console.warn('[Beauty & Rose] Set BR_CONFIG.googleMapsUrl.');

  document.getElementById('year').textContent = new Date().getFullYear();

  /* ---------- Toast (setup notice only) ---------- */
  var toastEl = document.getElementById('toast'), toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('is-visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('is-visible'); }, 2600);
  }

  /* ---------- Click tracking (one delegated listener = no duplicate bindings) ---------- */
  var lastClick = typeof WeakMap === 'function' ? new WeakMap() : null;

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-track]') : null;
    if (!el) return;

    // Link not configured yet → show notice, no navigation, no tracking
    var unset = el.getAttribute('data-unset');
    if (unset) { e.preventDefault(); toast(unset); return; }

    // De-duplicate rapid double taps (also prevents opening WhatsApp twice)
    if (lastClick) {
      var now = Date.now(), prev = lastClick.get(el) || 0;
      if (now - prev < DEDUPE_MS) { e.preventDefault(); return; }
      lastClick.set(el, now);
    }

    switch (el.getAttribute('data-track')) {
      case 'service':
        var sid = el.getAttribute('data-service');
        track('service_click',  { service_name: sid, service_category: el.getAttribute('data-category'), destination: 'whatsapp' });
        track('whatsapp_click', { source: 'service_card', service_name: sid });
        break;
      case 'whatsapp':
        track('whatsapp_click', { source: el.getAttribute('data-source') || 'floating_cta', service_name: 'general' });
        break;
      case 'location':
        track('location_click', { destination: 'google_maps' });
        break;
      case 'instagram':
        track('instagram_click', { destination: 'instagram' });
        break;
    }
  });
})();
</script>
</body>
</html>
